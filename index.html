<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달리 표현할 수 없어요 - 음정 연습 v011</title>
<style>
:root{
  --bg:#080b10;--panel:#0e141e;--panel2:#070c13;--line:#263044;
  --text:#f7f8fb;--muted:#8490a3;--target:#ffd84a;--me:#50dcff;
  --ok:#59df8d;--fast:#ffad55;--slow:#68a9ff;--miss:#ff6777;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button,.fileBtn{border:0;border-radius:11px;padding:10px 14px;background:#252e3d;color:#fff;cursor:pointer}
button.primary{background:#f3ca3d;color:#161616;font-weight:850}
button.on{background:#153b2c;color:#7af0a9}
.wrap{max-width:1180px;margin:auto;padding:16px 20px 28px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.fileBtn{display:inline-flex}.fileBtn input{display:none}
.modeSel{border:1px solid #293449;background:#151d29;color:#fff;border-radius:11px;padding:10px 13px;font:inherit}
.syncStatus{padding:7px 10px;border-radius:999px;background:#182131;color:#9eabc0;font-size:12px}
.name{margin-left:auto;color:var(--muted);font-size:13px}

.stage{margin-top:14px;border:1px solid #20293a;border-radius:22px;background:var(--panel);padding:21px}
.lyrics{min-height:190px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.syllableLine{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:4px 7px;min-height:112px;padding:4px}
.syl{min-width:42px;padding:5px 5px 7px;border-radius:10px;position:relative;transition:.08s}
.syl .char{display:block;font-size:clamp(28px,3.7vw,47px);font-weight:900;line-height:1.05;color:#f5f6f8}
.syl .note{display:block;margin-top:8px;font-size:13px;font-weight:800;color:#697688;min-height:20px;white-space:nowrap}
.syl.done .char{color:var(--target)}
.syl.active{background:rgba(255,216,74,.12);outline:1px solid rgba(255,216,74,.35)}
.syl.active .char,.syl.active .note{color:var(--target)}
.syl.multi .note{color:#f0bc48}
.syl.ok::after,.syl.fast::after,.syl.slow::after,.syl.miss::after{
 content:"";position:absolute;left:10%;right:10%;bottom:0;height:4px;border-radius:5px
}
.syl.ok::after{background:var(--ok)}.syl.fast::after{background:var(--fast)}
.syl.slow::after{background:var(--slow)}.syl.miss::after{background:var(--miss)}
.space{width:18px}
.next{font-size:clamp(19px,2.2vw,27px);color:#7c8798;margin-top:7px;min-height:36px}
.badge{display:inline-block;margin-top:9px;padding:7px 12px;border-radius:999px;background:#222a37;color:#aab4c5;font-weight:800}
.badge.ok{color:#7bf0aa;background:rgba(89,223,141,.13)}
.badge.fast{color:#ffc17e;background:rgba(255,173,85,.13)}
.badge.slow{color:#8cbdff;background:rgba(104,169,255,.13)}
.badge.miss{color:#ff909b;background:rgba(255,103,119,.13)}

.pitch{margin-top:12px;border:1px solid #20293a;border-radius:18px;background:#080d14;padding:13px}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:#939fb2;font-size:13px;margin-bottom:8px}
.key{display:inline-flex;align-items:center;gap:6px}.dot{width:11px;height:11px;border-radius:50%}
.targetDot{background:var(--target)}.meDot{background:var(--me)}
.canvasWrap{height:380px;border-radius:13px;overflow:hidden;background:var(--panel2)}
canvas{width:100%;height:100%;display:block}
.noteHelp{text-align:center;color:#697588;font-size:12px;margin-top:8px}

.transport{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:15px}
#seek{width:100%;accent-color:#f2c93d}
.time{min-width:92px;text-align:right;color:#a8b2c2;font-size:13px;font-variant-numeric:tabular-nums}
video{display:none}
@media(max-width:700px){
 .wrap{padding:10px}.stage{padding:14px 9px}.canvasWrap{height:320px}.name{width:100%;margin-left:0}
 .syl{min-width:35px}.syl .note{font-size:11px}.space{width:10px}
}

.accentMark{display:block;height:14px;line-height:14px;font-size:11px;font-weight:900;color:#ff9f43;opacity:.95;margin-bottom:2px}
.syl:not(.hasAccent) .accentMark{visibility:hidden}
.phraseCue{min-height:28px;margin-top:6px;font-size:14px;font-weight:800;color:#9eabc0}
.phraseCue .breath{display:inline-block;padding:5px 10px;border-radius:999px;background:#16273a;color:#75cfff;border:1px solid #244c6b}
.phraseCue .deep{background:#26213a;color:#c3a8ff;border-color:#493d6c}
.legendCue{display:inline-flex;align-items:center;gap:5px}.accentLegend{color:#ff9f43;font-weight:900}.breathLegend{color:#75cfff;font-weight:850}.deepLegend{color:#c3a8ff;font-weight:850}

.fullLyricsPanel{margin-top:16px;border:1px solid #20293a;border-radius:18px;background:#0b111a;padding:14px}
.fullLyricsHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.fullLyricsTitle{font-size:17px;font-weight:900}.fullLyricsHint{font-size:12px;color:#768397}
.fullLyricsList{max-height:430px;overflow:auto;padding:5px;border-radius:12px;background:#070c13;scroll-behavior:smooth}
.fullLyricLine{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;border-radius:9px;background:transparent;color:#cbd3df;padding:9px 11px;cursor:pointer;transition:.08s}
.fullLyricLine:hover{background:#151e2b}.fullLyricLine.active{background:rgba(255,216,74,.13);color:#fff;outline:1px solid rgba(255,216,74,.30)}
.fullLyricLine .playMark{width:16px;color:#58667a;font-size:11px;flex:0 0 16px}.fullLyricLine.active .playMark{color:#ffd84a}
.fullLyricText{flex:1;font-size:15px;line-height:1.45}.fullLyricTime{font-size:11px;color:#667489;font-variant-numeric:tabular-nums}
.fullLyricBreath{flex:0 0 auto;font-size:10px;font-weight:850;padding:3px 6px;border-radius:999px;background:#16273a;color:#75cfff}.fullLyricBreath.deep{background:#26213a;color:#c3a8ff}
.fullAccent{color:#ffb35d;font-weight:900}
@media(max-width:700px){.fullLyricsList{max-height:360px}.fullLyricLine{padding:9px 8px;gap:6px}.fullLyricText{font-size:14px}.fullLyricTime{display:none}}

</style>
</head>

<div class="wrap">
 <div class="toolbar">
  <label class="fileBtn">음원 열기<input id="songFile" type="file" accept="audio/*,video/*"></label>
  <button id="micBtn">마이크 켜기</button>
  <button id="playBtn" class="primary">재생</button>
  <button id="loopBtn" class="on">반복 ON</button>
<select id="mode" class="modeSel" aria-label="재생 모드"><option value="all">전체 재생</option><option value="verse1">1절 반복</option></select>
<span id="syncStatus" class="syncStatus">자동 맞춤 대기</span>

  <div class="transport">

 </div>

  <div id="fullLyricsList" class="fullLyricsList"></div>
 </section>
 <video id="media" playsinline></video>
</div>

function resizeCanvas(){
 const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,window.devicePixelRatio||1));
 canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",resizeCanvas);

function rr(x,y,w,h,r,color){
 ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
 ctx.fillStyle=color;ctx.fill();
}

function buildVisibleTargetNotes(info,t0,t1){
 const out=[];
 if(!info)return out;
 // 현재 줄 + 다음 줄 일부를 한 시간축으로 모은다.
 const candidates=[];
 for(let si=Math.max(0,info.si-1);si<=Math.min(segments.length-1,info.si+1);si++){
  for(const u of normalUnits(segments[si])){
   for(const n of (u.targetNotes||[])){
    if(n.end>=t0&&n.start<=t1)candidates.push({...n,char:u.char,unitStart:u.time});
   }
  }
 }
 candidates.sort((a,b)=>a.start-b.start);
 return candidates;
}

function drawPitch(fileT){
 const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);

 const info=activeInfo(fileT);
 const target=info?.u?.targetNotes?.length ? info.u.targetNotes[0].midi : info?.u?.targetMidi;
 if(Number.isFinite(target))centerMidi+=(target-centerMidi)*.07;
 else if(smoothMidi!=null)centerMidi+=(smoothMidi-centerMidi)*.02;

 const low=Math.floor(centerMidi)-7,high=low+14;
 const labelW=62,left=labelW,right=w-12,top=58,bottom=h-18;
 const pw=right-left,ph=bottom-top;
 const t0=fileT-1.15,t1=fileT+3.75;
 const targetT0=fileToTargetTime(t0),targetT1=fileToTargetTime(t1);
 const x=tt=>left+(tt-t0)/(t1-t0)*pw;
 const y=m=>bottom-(m-low)/(high-low)*ph;

 ctx.font="12px Malgun Gothic";ctx.textBaseline="middle";
 for(let m=Math.ceil(low);m<=Math.floor(high);m++){
  const label=noteNames[(m%12+12)%12],natural=!label.includes("♯"),yy=y(m);
  ctx.strokeStyle=natural?"rgba(160,175,200,.19)":"rgba(160,175,200,.055)";
  ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(right,yy);ctx.stroke();
  if(natural){ctx.fillStyle="#9da9bb";ctx.textAlign="right";ctx.fillText(midiLabel(m),labelW-8,yy)}
 }

 // 음절 구간을 상단에 실제 시간 비율로 표시
 if(info){
  for(let si=Math.max(0,info.si-1);si<=Math.min(segments.length-1,info.si+1);si++){
   const us=normalUnits(segments[si]);
   for(let ui=0;ui<us.length;ui++){
    const u=us[ui];
    const usEnd=ui+1<us.length?us[ui+1].time:segments[si].end;
    if(usEnd<targetT0||u.time>targetT1)continue;
    const x1=Math.max(left,x(targetToFileTime(u.time))),x2=Math.min(right,x(targetToFileTime(usEnd)));
    const active=si===info.si&&ui===info.ui;

    if(active){
     ctx.fillStyle="rgba(255,216,74,.08)";
     ctx.fillRect(x1,top,x2-x1,bottom-top);
    }

    ctx.textAlign="center";ctx.textBaseline="bottom";
    ctx.font=active?"bold 19px Malgun Gothic":"14px Malgun Gothic";
    ctx.fillStyle=active?"#ffd84a":"#9da8b9";
    ctx.fillText(u.char,(x1+x2)/2,26);

    ctx.textBaseline="top";ctx.font=active?"bold 12px Malgun Gothic":"11px Malgun Gothic";
    ctx.fillStyle=active?"#ffd84a":"#718094";
    ctx.fillText(compactNoteSequence(u),(x1+x2)/2,30);
   }
  }
 }

 // 목표 음정: 긴 노란 선 + 음 변화 사이를 연결해 '뚝뚝' 끊기지 않게 보이게 한다.
 const notes=buildVisibleTargetNotes(info,targetT0,targetT1);
 if(notes.length){
  // 얇은 연결선 먼저
  ctx.strokeStyle="rgba(255,216,74,.72)";
  ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  let prev=null;
  for(const n of notes){
   const sx=Math.max(left,x(targetToFileTime(n.start))),ex=Math.min(right,x(targetToFileTime(n.end))),yy=y(n.midi);
   if(!prev){
    ctx.moveTo(sx,yy);
   }else{
    const gap=n.start-prev.end;
    if(gap<=.14){
     // 다음 음으로 부드럽게 연결
     ctx.lineTo(sx,yy);
    }else{
     ctx.moveTo(sx,yy);
    }
   }
   ctx.lineTo(ex,yy);
   prev=n;
  }
  ctx.stroke();

  // 실제 음정 구간은 굵은 막대로 덮는다.
  for(const n of notes){
   if(n.midi<low-1||n.midi>high+1)continue;
   const sx=Math.max(left,x(targetToFileTime(n.start))),ex=Math.min(right,x(targetToFileTime(n.end))),yy=y(n.midi);
   rr(sx,yy-6,Math.max(4,ex-sx),12,6,"#ffd84a");
  }
 }

 // 현재 재생 위치
 const nowX=x(fileT);
 ctx.strokeStyle="rgba(255,255,255,.42)";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(nowX,top);ctx.lineTo(nowX,bottom);ctx.stroke();

 // 내 음정: 실제 시간축에 연속 선으로 표시
 const pts=micTrail.filter(p=>p.t>=t0&&p.t<=fileT&&p.m>=low-1&&p.m<=high+1);
 if(pts.length){
  ctx.strokeStyle="#50dcff";ctx.lineWidth=3.5;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();let prev=null;
  for(const p of pts){
   const xx=x(p.t),yy=y(p.m);
   const br=!prev||p.t-prev.t>.15||Math.abs(p.m-prev.m)>7;
   if(br)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
   prev=p;
  }
  ctx.stroke();

  const p=pts[pts.length-1];
  if(fileT-p.t<.17){
   const xx=x(p.t),yy=y(p.m);
   ctx.shadowColor="#50dcff";ctx.shadowBlur=15;ctx.fillStyle="#50dcff";
   ctx.beginPath();ctx.arc(xx,yy,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
   ctx.strokeStyle="#e5faff";ctx.lineWidth=2;ctx.stroke();
  }
 }
}

function frame(){
 const t=media.currentTime||0;
 updateLyrics(t);if(micOn)analyseMic();if(micOn&&!media.paused)markMisses(t);drawPitch(t);
 if(media.duration){seek.value=Math.round(t/media.duration*1000);timeEl.textContent=`${fmt(t)} / ${fmt(media.duration)}`}
 playBtn.textContent=media.paused?"재생":"일시정지";
 requestAnimationFrame(frame);
}

songFile.onchange=()=>{
 const f=songFile.files?.[0];if(!f)return;
 if(media.src)URL.revokeObjectURL(media.src);
 media.src=URL.createObjectURL(f);media.load();
 nameEl.textContent=f.name;judged.clear();micTrail=[];currentSeg=-999;setBadge("","박자 대기");
 media.onloadedmetadata=()=>{
   chooseSyncProfile(media.duration,f.name);
   timeEl.textContent=`0:00 / ${fmt(media.duration)}`;
   if(modeEl?.value==="verse1")media.currentTime=Math.max(0,targetToFileTime(verse1.start));
 };
};
micBtn.onclick=toggleMic;
playBtn.onclick=async()=>{
 if(!media.src){alert("음원 또는 MR 파일을 먼저 열어 주세요.");return}
 if(media.paused){
   if(modeEl?.value==="verse1"){
     const st=targetToFileTime(verse1.start),en=targetToFileTime(verse1.end);
     if(media.currentTime<st||media.currentTime>=en)media.currentTime=Math.max(0,st);
   }
   try{await media.play()}catch(e){}
 }else media.pause();
};
modeEl?.addEventListener("change",()=>{
 judged.clear();micTrail=[];currentSeg=-999;setBadge("","박자 대기");
 if(modeEl.value==="verse1"&&media.duration){
   media.currentTime=Math.max(0,targetToFileTime(verse1.start));
 }
});
media.addEventListener("timeupdate",()=>{
 if(modeEl?.value==="verse1"&&media.duration){
   const en=targetToFileTime(verse1.end);
   if(media.currentTime>=en-.03){
     judged.clear();micTrail=[];currentSeg=-999;setBadge("","박자 대기");
     media.currentTime=Math.max(0,targetToFileTime(verse1.start));
     if(!media.paused)media.play().catch(()=>{});
   }
 }
});
loopBtn.onclick=()=>{loop=!loop;loopBtn.textContent=loop?"반복 ON":"반복 OFF";loopBtn.classList.toggle("on",loop)};
$("backBtn").onclick=()=>media.currentTime=Math.max(0,(media.currentTime||0)-5);
seek.oninput=()=>{if(media.duration)media.currentTime=media.duration*Number(seek.value)/1000};
media.onended=async()=>{
 if(modeEl?.value==="verse1"){
   judged.clear();micTrail=[];currentSeg=-999;media.currentTime=Math.max(0,targetToFileTime(verse1.start));setBadge("","박자 대기");
   try{await media.play()}catch(e){};return;
 }
 if(!loop)return;
 judged.clear();micTrail=[];currentSeg=-999;media.currentTime=0;setBadge("","박자 대기");
 try{await media.play()}catch(e){}
};

renderFullLyrics();
resizeCanvas();
requestAnimationFrame(frame);
</script>
